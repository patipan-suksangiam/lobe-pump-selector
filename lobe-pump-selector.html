  {size:'0200X', disp:0.18,     portIn:1.5, portMm:38,  s4a:-0.0052,  s4b:0.1888,  s4c:2.7607,  s4d:24.9335,                  s2a:-0.4107, s2b:13.25,  s2c:20.0175, minBarSlip:9,   maxBarSlip:30,  portDia:35,  maxTorque:342,   maxSpeed:1000, maxPres:14,  rollTorque:7,  viscExp:0.22, viscPowF:41,  rotorDia:88,  margin:1},
  {size:'0300X', disp:0.25,     portIn:1.5, portMm:38,  s4a:-0.0295,  s4b:0.6636,  s4c:5.7638,  s4d:31.7165,                  s2a:-0.5,    s2b:14.3,   s2c:20,      minBarSlip:12,  maxBarSlip:36,  portDia:35,  maxTorque:342,   maxSpeed:1000, maxPres:9,   rollTorque:7,  viscExp:0.22, viscPowF:35,  rotorDia:132, margin:1},
  {size:'0400X', disp:0.33,     portIn:2,   portMm:51,  s4a:-0.0682,  s4b:1.2424,  s4c:8.7576,  s4d:39.253,                   s2a:-1,      s2b:21,     s2c:10,      minBarSlip:15,  maxBarSlip:42,  portDia:47.6, maxTorque:342,   maxSpeed:1000, maxPres:7,   rollTorque:7,  viscExp:0.22, viscPowF:30,  rotorDia:132, margin:1},
  {size:'0450X', disp:0.45,     portIn:2,   portMm:51,  s4a:-0.007,   s4b:0.2511,  s4c:3.4556,  s4d:34.6755,                  s2a:-0.4286, s2b:21,     s2c:19.715,  minBarSlip:17,  maxBarSlip:45,  portDia:47.6, maxTorque:570,   maxSpeed:800,  maxPres:15,  rollTorque:14, viscExp:0.33, viscPowF:30,  rotorDia:178, margin:1},
  {size:'0800X', disp:0.82,     portIn:2.5, portMm:64,  s4a:-0.0335,  s4b:0.7652,  s4c:6.6093,  s4d:43.104,                   s2a:-0.4286, s2b:22.26,  s2c:24.415,  minBarSlip:20,  maxBarSlip:50,  portDia:60.5, maxTorque:570,   maxSpeed:800,  maxPres:9,   rollTorque:14, viscExp:0.33, viscPowF:20,  rotorDia:224, margin:1},
  {size:'1300X', disp:1.07,     portIn:3,   portMm:76,  s4a:-0.0814,  s4b:1.4482,  s4c:10.108,  s4d:52.817,                   s2a:-1,      s2b:29,     s2c:22,      minBarSlip:30,  maxBarSlip:65,  portDia:72,  maxTorque:570,   maxSpeed:800,  maxPres:7,   rollTorque:14, viscExp:0.33, viscPowF:20,  rotorDia:224, margin:1},
  {size:'1800X', disp:1.55,     portIn:3,   portMm:76,  s4a:-0.2083,  s4b:2.8426,  s4c:15.846,  s4d:68.6025,                  s2a:-0.4286, s2b:27.3,   s2c:46.215,  minBarSlip:30,  maxBarSlip:110, portDia:72,  maxTorque:1073,  maxSpeed:600,  maxPres:15,  rollTorque:35, viscExp:0.18, viscPowF:22,  rotorDia:225, margin:1},
  {size:'2200X', disp:2.1,      portIn:4,   portMm:102, s4a:-0.4583,  s4b:5.9537,  s4c:30.319,  s4d:120.63,                   s2a:-1.5,    s2b:58.4,   s2c:48.45,   minBarSlip:35,  maxBarSlip:120, portDia:97,  maxTorque:1073,  maxSpeed:600,  maxPres:8,   rollTorque:35, viscExp:0.18, viscPowF:20,  rotorDia:226, margin:1},
  {size:'3000L', disp:2.9,      portIn:4,   portMm:102, s4a:-0.375,   s4b:4.8981,  s4c:24.986,  s4d:99.1525,                  s2a:-0.7679, s2b:42.6,   s2c:55.1975, minBarSlip:40,  maxBarSlip:130, portDia:97,  maxTorque:1073,  maxSpeed:500,  maxPres:15,  rollTorque:55, viscExp:0.24, viscPowF:20,  rotorDia:227, margin:1},
  {size:'3800L', disp:3.8,      portIn:6,   portMm:152, s4a:-0.625,   s4b:8.25,    s4c:42.4,    s4d:170.475,                   s2a:-2,      s2b:81.4,   s2c:76,      minBarSlip:50,  maxBarSlip:150, portDia:145, maxTorque:1785,  maxSpeed:500,  maxPres:8,   rollTorque:55, viscExp:0.24, viscPowF:19,  rotorDia:228, margin:1},
  {size:'4000L', disp:5.2,      portIn:6,   portMm:152, s4a:-0.5833,  s4b:7.537,   s4c:38.194,  s4d:152.0575,                 s2a:-1.1964, s2b:65.7,   s2c:84.41,   minBarSlip:70,  maxBarSlip:180, portDia:145, maxTorque:2965,  maxSpeed:400,  maxPres:15,  rollTorque:80, viscExp:0.24, viscPowF:17,  rotorDia:229, margin:1},
  {size:'5000L', disp:7.2,      portIn:8,   portMm:203, s4a:-0.875,   s4b:11.935,  s4c:63.764,  s4d:267.22,                   s2a:-2.75,   s2b:125.2,  s2c:129.75,  minBarSlip:90,  maxBarSlip:300, portDia:190, maxTorque:2965,  maxSpeed:400,  maxPres:8,   rollTorque:80, viscExp:0.24, viscPowF:14,  rotorDia:230, margin:1},
];

// unit conversions (selector columns X1..X6 / X8..X11 / X13..X16)
const FLOW_TO_LMIN = {'l/m':1, 'm³/hr':16.66666666, 'usgpm':3.785412, 'gpm':4.546092, 'l/s':60, 'l/hr':0.016667};
const PRES_TO_BAR  = {'Bar':1, 'psi':0.06894757, 'kPa':0.01, 'MPa':10};
const VISC_TO_CP   = {'cP':1, 'Pas':1000, 'mPas':1}; // SSU handled separately

function flowToLmin(v, unit){ return v * FLOW_TO_LMIN[unit]; }
function presToBar(v, unit){ return v * PRES_TO_BAR[unit]; }
function viscToCP(v, unit){
  if (unit === 'SSU'){ return Math.round(v < 100 ? 0.226*v - 155/v - 1 : 0.21606*v - 195/v); }
  return v * (VISC_TO_CP[unit] ?? 1);
}

// E46 — viscosity multiplier for slip / flow
function viscMultFlow(cP){
  if (cP >= 400) return 0;
  if (cP > 90)   return (-0.01275*cP + 5.0968) / 100;
  if (cP >= 1)   return -0.42 * Math.pow(Math.log(cP), 0.55) + 1;
  return NaN; // "N/A"
}
// E125 — viscosity multiplier for torque power
function viscMultTorque(cP, f){ return Math.pow(cP, f.viscExp); }

function slipStd(f, barISF, vm){           // E60
  let s;
  if (barISF < 5) s = f.s4a*Math.pow(barISF,4) + f.s4b*Math.pow(barISF,3) - f.s4c*Math.pow(barISF,2) + f.s4d*barISF;
  else            s = f.s2a*barISF*barISF + f.s2b*barISF + f.s2c;
  return s * f.margin * vm;
}
function slipHot(f, bar, barISF, vm){      // E61 = E60 + E66*vm
  const add = ((f.maxBarSlip - f.minBarSlip) * bar / f.maxPres) + f.minBarSlip; // E66 (raw bar, not ISF)
  return slipStd(f, barISF, vm) + add * vm;
}

// E133/E134 — raw rpm required (per class)
function rpmRaw(f, flow, slip){ return (flow + slip) / f.disp; }

// E95/E96 — NPSHr
function npshr(f, rpm, cP){
  return ( (f.disp / (f.portDia*f.portDia)) * Math.pow(rpm + 300, 2) * ( Math.pow(cP, 0.8) * (Math.pow(f.portDia, -1.2) * 0.0047) + 0.01 ) ) + 1.3;
}

// E123 — corner cutoff rpm at duty pressure
function cornerRpm(f, bar){
  const atMaxSpeed = 0.7 * f.maxPres;      // E120
  const atMaxPres  = f.maxSpeed * 0.75;    // E119
  if (bar < atMaxSpeed) return f.maxSpeed;
  return f.maxSpeed - (f.maxSpeed - atMaxPres) * (bar - atMaxSpeed) / (f.maxPres - atMaxSpeed);
}

// E131 — torque required (Nm, pressure & viscosity dependent, rpm independent)
function torqueReq(f, bar, cP){
  const vmT = viscMultTorque(cP, f);
  const roll = 0.01 / f.maxSpeed * f.rollTorque;          // E127
  const visc = f.viscPowF * f.disp * vmT;                 // E129
  return roll + visc + bar * (16.5 * f.disp);             // E126 = 16.5*disp
}

// power = torque * rpm / 9550  (HP: *1.34)
function powerKw(torque, rpm){ return torque * rpm / 9550; }

// tip speed m/s — E151 (uses display rpm)
function tipSpeed(f, rpm){ return Math.PI * f.rotorDia / 1000 * rpm / 60; }

// flow / speed variation (r154/r155 = 0 for every RLP size -> always 0)
function flowVariationLmin(){ return 0; }
function speedVariation(){ return 0; }

/**
 * Full calculation for one size + one rotor class.
 * returns { size, ok, rpm, power, torque, npshr, tip, rpmMax, ... } or {size, ok:false, reason}
 */
function calcSize(f, env, cls){
  const { flow, bar, barISF, cP, hpUnits } = env;
  if (bar > f.maxPres)         return { size: f.size, ok:false, reason:'pressure exceeds max' };

  const vm  = viscMultFlow(cP);
  const slip = cls === 'hot' ? slipHot(f, bar, barISF, vm) : slipStd(f, barISF, vm);
  const rpm = rpmRaw(f, flow, slip);
  if (!(rpm < f.maxSpeed))     return { size: f.size, ok:false, reason:'rpm exceeds max' };

  const np  = npshr(f, rpm, cP);
  const cor = cornerRpm(f, bar);
  if (!(np < 15))              return { size: f.size, ok:false, reason:'NPSHr > 15 m' };
  if (!(rpm <= cor))           return { size: f.size, ok:false, reason:'outside corner curve' };
  if (!(rpm > 0))              return { size: f.size, ok:false, reason:'rpm <= 0' };

  const tq  = torqueReq(f, bar, cP);
  if (!(tq < f.maxTorque))     return { size: f.size, ok:false, reason:'torque exceeds max' };

  const power = powerKw(tq, rpm);
  return {
    size: f.size, ok: true, cls,
    rpm, power: hpUnits ? power * 1.34 : power,
    torque: hpUnits ? tq * 0.737561 : tq,
    npshr: hpUnits ? np * 3.28083 : np,
    tip: null, // filled in calcAll (workbook uses Std rpm for tip speed)
    flowVar: flowVariationLmin(), speedVar: speedVariation(),
    disp: f.disp, portIn: f.portIn, portMm: f.portMm, rotorDia: f.rotorDia,
    maxSpeed: f.maxSpeed, maxPres: f.maxPres, maxTorque: f.maxTorque,
    slip, torqueNm: tq,
  };
}

/**
 * env: { flowLmin, bar, barISF, cP, hpUnits }
 */
function calcAll(inputs){
  const flow = flowToLmin(inputs.flow, inputs.flowUnit);
  const bar  = presToBar(inputs.pres, inputs.presUnit);
  const barISF = inputs.isf ? (bar > 1 ? bar + 1 : bar * 2) : bar;   // X18
  const cP   = viscToCP(inputs.visc, inputs.viscUnit);
  const hpUnits = (inputs.flowUnit === 'gpm' || inputs.flowUnit === 'usgpm');
  const env = { flow, bar, barISF, cP, hpUnits };
  const std = SIZE_DATA.map(f => calcSize(f, env, 'std'));
  const hot = SIZE_DATA.map(f => calcSize(f, env, 'hot'));
  // workbook quirk: tip speed (r151) always uses the Std-class display rpm
  std.forEach((s, i) => { if (s.ok) s.tip = tipSpeed(SIZE_DATA[i], s.rpm); });
  hot.forEach((s, i) => { if (s.ok && std[i].ok) s.tip = tipSpeed(SIZE_DATA[i], std[i].rpm); });
  const recommended = std.find(r => r.ok);
  return {
    env: { flow, bar, barISF, cP, hpUnits, flowUnit: inputs.flowUnit, presUnit: inputs.presUnit },
    std, hot, recommended: recommended ? recommended.size : null,
  };
}

// ---- module export (Node) / window (browser) ----
if (typeof module !== 'undefined') module.exports = { SIZE_DATA, calcAll, calcSize, flowToLmin, presToBar, viscToCP };
if (typeof window !== 'undefined') window.RLPEngine = { SIZE_DATA, calcAll, calcSize };


const RLP = window.RLPEngine;

const UNITS = {
  flow: ['l/m','m³/hr','usgpm','gpm','l/s','l/hr'],
  pres: ['Bar','psi','kPa','MPa'],
  visc: ['cP','Pas','mPas','SSU'],
};

const clsLabel = cls => cls === 'hot' ? 'Hot / 150°C' : 'Standard / 70°C';
const tempLimit = cls => cls === 'hot' ? 'Hot / 150°C (300°F)' : 'Standard / 70°C (160°F)';

const f = (v, d) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(d);

        <div className="lbl mb-1">&nbsp;</div>
        <select className="inp" value={unit} onChange={e => onUnit(e.target.value)}>
          {units.map(u => <option key={u} value={u}>{u}</option>)}
        </select>
      </div>
    </div>
  );
}

function App() {
  const [flow, setFlow] = React.useState('10');
  const [flowUnit, setFlowUnit] = React.useState('l/m');
  const [pres, setPres] = React.useState('1');

  const [proj, setProj] = React.useState('');
  const [prep, setPrep] = React.useState('');

                   visc: parseFloat(visc)||0, viscUnit, isf };
  const res = React.useMemo(() => RLP.calcAll(inputs), [flow, flowUnit, pres, presUnit, visc, viscUnit, isf]);
  const rows = cls === 'hot' ? res.hot : res.std;
  const selRow = sel ? rows.find(r => r.size === sel) || null : null;
  const hp = res.env.hpUnits;

  const pUnit = hp ? 'HP' : 'kW', tUnit = hp ? 'lb-ft' : 'Nm', nUnit = hp ? 'ft' : 'm';

  function select(size) { setSel(sel === size ? null : size); }

  return (
  <>

      <div style={{fontSize:17,fontWeight:600,marginTop:2}}>REVOLUTION® RLP SERIES — Hygienic Rotary Lobe Pump Selector</div>
      <div className="tagline mt-1">Formerly Wright Flow Technologies (WFT) &nbsp;•&nbsp; vikingpump.com/hygienic</div>
    </div>

    {/* inputs */}
    <div className="card p-5 mb-5">
      <div className="sec mb-4">1 &nbsp;•&nbsp; APPLICATION / DUTY</div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <Input label="Flowrate" value={flow} onChange={setFlow} unit={flowUnit} onUnit={setFlowUnit} units={UNITS.flow}/>
        <Input label="Pressure" value={pres} onChange={setPres} unit={presUnit} onUnit={setPresUnit} units={UNITS.pres}/>
        <Input label="Viscosity" value={visc} onChange={setVisc} unit={viscUnit} onUnit={setViscUnit} units={UNITS.visc}/>
        <div>
          <div className="lbl mb-1">Improved Surface Finish</div>
          <div className="flex gap-2">
            <button className={"btn flex-1 " + (!isf?'active':'')} onClick={() => setIsf(false)}>No</button>
            <button className={"btn flex-1 " + (isf?'active':'')} onClick={() => setIsf(true)}>Yes</button>

    {/* results */}
    <div className="card p-5 mb-5">
      <div className="flex items-center justify-between mb-4">
        <div className="sec">2 &nbsp;•&nbsp; SELECTION RESULTS</div>
        <div className="flex gap-2">
          <button className={"btn " + (cls==='std'?'active':'')} onClick={() => setCls('std')}>Standard / 70°C</button>
          <button className={"btn " + (cls==='hot'?'active':'')} onClick={() => setCls('hot')}>Hot / 150°C</button>
        </div>
      </div>
      {res.recommended && <div className="mb-3 foot">★ Recommended (auto): <b style={{color:'#3fb950'}}>{res.recommended}</b> — smallest size meeting the duty (Standard class)</div>}
      <div style={{maxHeight:430, overflow:'auto'}}>
      <table className="res">

          <th>Size</th><th>Disp<br/><span className="unit">l/rev</span></th><th>Port<br/><span className="unit">in (mm)</span></th>
          <th>RPM</th><th>Power<br/><span className="unit">{pUnit}</span></th><th>Torque<br/><span className="unit">{tUnit}</span></th>

        <tbody>
        {rows.map(r => {
          const rec = r.size === res.recommended;
          const isSel = r.size === sel;
          return (
            <tr key={r.size} className={"clickable " + (r.ok?'':'na ') + (rec?'rec ':'') + (isSel?'sel':'')} onClick={() => r.ok && select(r.size)}
                title={r.ok ? 'Click to build datasheet' : r.reason}>
              <td><b>{r.size}</b>{rec && <span className="badge-rec ml-1">★ REC</span>}</td>
              <td>{f(r.disp,3)}</td>
              <td>{r.portIn} <span className="unit">({r.portMm})</span></td>
              <td>{r.ok ? f(r.rpm,0) : '—'}</td>
              <td>{r.ok ? f(r.power,2) : '—'}</td>
              <td>{r.ok ? f(r.torque,2) : '—'}</td>
              <td>{r.ok ? f(r.npshr,2) : '—'}</td>
              <td>{r.ok ? f(r.tip,2) : '—'}</td>
              <td>{r.maxSpeed}</td>
              <td>{r.maxPres}</td>
              <td>{r.ok ? (isSel ? '✓' : '') : '✕'}</td>
            </tr>
          );
        })}
        </tbody>
      </table>
      </div>
      {!res.recommended && <div className="mt-3" style={{color:'#f0883e'}}>⚠ No pump size meets this duty — check flow / pressure / viscosity.</div>}
    </div>

    {/* datasheet */}
    <div className="card p-5 mb-5">
      <div className="flex items-center justify-between mb-4">
        <div className="sec">3 &nbsp;•&nbsp; PUMP DATASHEET {sel && <span style={{fontWeight:400}}>— {sel} / {clsLabel(cls)}</span>}</div>
        {selRow && <button className="btn" onClick={() => window.print()}>🖨 Print Datasheet</button>}
      </div>
      {!selRow ? (
        <div className="foot">Click a valid pump row above to build its datasheet. Recommended: <b style={{color:'#3fb950'}}>{res.recommended||'—'}</b></div>
      ) : (
        <Datasheet row={selRow} cls={cls} env={res.env} hp={hp}
                   cust={cust} setCust={setCust} proj={proj} setProj={setProj}
                   prep={prep} setPrep={setPrep} dateStr={dateStr}/>
      )}
    </div>

    <div className="foot text-center pb-4">
      Values auto-calculated per the WFT “Revolution RLP” selector (Issue C.10/13). Confirm final selection with Viking Pump Hygienic Ltd.
      <br/>Product, option & certification data: vikingpump.com/hygienic — 3-A SSI • CE (2006/42/EC) • ATEX. Made in Cedar Falls, Iowa, USA & Eastbourne, UK.
    </div>
  </div>
  {selRow && (
    <div className="ds max-w-7xl mx-auto mb-8">
      <Datasheet row={selRow} cls={cls} env={res.env} hp={hp}
                 cust={cust} setCust={setCust} proj={proj} setProj={setProj}
                 prep={prep} setPrep={setPrep} dateStr={dateStr}/>
    </div>
  )}
  </>
  );
}

function Row({l, v, u}) {
  return (
    <tr>
      <td style={{color:'#57606a',width:'38%'}}>{l}</td>
      <td style={{fontWeight:700}}>{v}</td>
      <td style={{color:'#57606a'}}>{u}</td>
    </tr>
  );
}

function Datasheet({ row, cls, env, hp, cust, setCust, proj, setProj, prep, setPrep, dateStr }) {
  const pUnit = hp ? 'HP' : 'kW', tUnit = hp ? 'lb-ft' : 'Nm', nUnit = hp ? 'ft' : 'm';
  return (
    <table>
        <tr><td colSpan="3" style={{background:'#1F4E79',color:'#fff',fontSize:20,fontWeight:800}}>VIKING PUMP HYGIENIC</td></tr>
        <tr><td colSpan="3" style={{background:'#1F4E79',color:'#fff',fontWeight:600}}>REVOLUTION® RLP SERIES — HYGIENIC ROTARY LOBE PUMP</td></tr>
        <tr><td colSpan="3" style={{background:'#eaeaea',fontStyle:'italic',fontSize:11}}>Formerly Wright Flow Technologies (WFT) &nbsp;•&nbsp; Source: vikingpump.com/hygienic</td></tr>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>1 • APPLICATION / DUTY</td></tr>
        <tr>
          <td>Customer <input className="inp" style={{background:'#fff',color:'#000',border:'1px solid #999'}} value={cust} onChange={e=>setCust(e.target.value)}/></td>
          <td>Project / Ref <input className="inp" style={{background:'#fff',color:'#000',border:'1px solid #999'}} value={proj} onChange={e=>setProj(e.target.value)}/></td>
          <td>Date: <b>{dateStr}</b></td>
        </tr>
        <tr>
          <td>Prepared by <input className="inp" style={{background:'#fff',color:'#000',border:'1px solid #999'}} value={prep} onChange={e=>setPrep(e.target.value)}/></td>
          <td>Flowrate: <b>{env.flow} {env.flowUnit}</b></td>
          <td>Pressure: <b>{env.bar} Bar</b></td>
        </tr>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>2 • SELECTED PUMP</td></tr>
        <Row l="Pump Size" v={row.size}/>
        <Row l="Rotor Class / Temperature Limit" v={tempLimit(cls)}/>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>3 • PERFORMANCE AT DUTY</td></tr>
        <Row l="Pump Speed" v={f(row.rpm,0)} u="rpm"/>
        <Row l="Power Required" v={f(row.power,2)} u={pUnit}/>
        <Row l="Torque Required" v={f(row.torque,2)} u={tUnit}/>
        <Row l="NPSHr" v={f(row.npshr,2)} u={nUnit}/>
        <Row l="Tip Speed" v={f(row.tip,2)} u="m/s"/>
        <Row l="Max Speed" v={row.maxSpeed} u="rpm"/>
        <Row l="Possible Flow Variation" v={f(row.flowVar,1)} u={env.flowUnit+' ±'}/>
        <Row l="Possible Speed Variation" v={f(row.speedVar,0)} u="rpm ±"/>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>4 • PUMP SPECIFICATIONS</td></tr>
        <Row l="Displacement" v={f(row.disp,3)} u="l/rev"/>
        <Row l="Port Size" v={row.portIn} u={'in ('+row.portMm+' mm)'}/>
        <Row l="Nominal Rotor Diameter" v={row.rotorDia} u="mm"/>
        <Row l="Max Pressure" v={f(row.maxPres,1)} u="Bar"/>
        <Row l="Max Shaft Torque" v={row.maxTorque} u="Nm"/>
        <tr><td colSpan="3" style={{fontSize:11,color:'#333'}}>Series capacity: to 399 GPM (91 m³/h) • to 450 PSI (31 Bar) • to 300°F (150°C) • to 2,000,000 SSU (440,000 cSt)</td></tr>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>5 • OPTIONS &amp; FEATURES</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• CIP (Clean-In-Place) standard — self-draining head, cusp reliefs, dynamic seal leak path, no dead zones</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• Porting — Hygienic: Tri-clamp, DIN 11864, DIN 11851 Male, SMS Male • Industrial: ASA/ANSI 150/300 lb RF, DIN 2633, BSP Male, NPT Male • Jackets available</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• Sealing — Single or Double Mechanical (with flush), Single or Double O-ring on replaceable sleeve; complete range of material options</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• Drives: purchased gear reducer • Mounting: foot mount • Front-loading seal changes &amp; front access shimming</td></tr>
        <tr><td colSpan="3" style={{background:'#2E75B6',color:'#fff',fontWeight:700}}>6 • CERTIFICATIONS &amp; MANUFACTURING</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• 3-A Sanitary Standards (3-A SSI) &nbsp;•&nbsp; CE — Machinery Directive 2006/42/EC &nbsp;•&nbsp; ATEX (EX)</td></tr>
        <tr><td colSpan="3" style={{fontSize:11}}>• Manufactured in Cedar Falls, Iowa, USA &amp; Eastbourne, UK — Viking Pump Hygienic Ltd. (formerly Wright Flow Technologies)</td></tr>
        <tr><td colSpan="3" style={{fontSize:9,color:'#666',fontStyle:'italic'}}>Generated by the WFT Lobe Pump Selector — values auto-calculated from the duty entered above. Confirm the final selection with Viking Pump Hygienic Ltd. • vikingpump.com/hygienic</td></tr>
      </table>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
