<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WFT Hygienic Pump Selector — Viking Pump Hygienic</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px; }
  .sec { background:#2e75b6; color:#fff; font-weight:700; font-size:12px; padding:3px 8px; border-radius:4px; display:inline-block; }
  .tab { padding:7px 14px; border-radius:8px 8px 0 0; cursor:pointer; border:1px solid #30363d; border-bottom:none; background:#0d1117; color:#9da7b3; font-size:13px; font-weight:600; }
  .tab.on { background:#161b22; color:#58a6ff; border-color:#58a6ff; }
  .inp { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:5px 8px; color:#e6edf3; width:100%; }
  select.inp { appearance:auto; }
  table.res { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.res th { background:#21262d; color:#c9d1d9; padding:6px 7px; border:1px solid #30363d; text-align:right; font-weight:600; white-space:nowrap; }
  table.res th.l { text-align:left; }
  table.res td { padding:5px 7px; border:1px solid #2d333b; text-align:right; white-space:nowrap; }
  table.res td.l { text-align:left; }
  tr.rec td { background:rgba(46,160,67,.18); }
  tr.bad td { color:#6e7681; }
  tr.sel td { outline:2px solid #58a6ff; outline-offset:-2px; }
  .badge { background:#2ea043; color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; }
  .ds { background:#fff; color:#000; padding:10px 12px; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.4); }
  .ds input.inp { background:#fff; border:1px solid #999; border-radius:3px; padding:2px 5px; color:#000; width:100%; font-size:10px; }
  .ds th { background:#1f4e79; color:#fff; padding:3px 5px; font-size:10px; text-align:left; }
  .ds td { border:1px solid #bbb; padding:2px 5px; font-size:10px; }
  .ds h2 { margin:0; color:#1f4e79; font-size:15px; }
  .ds .sec-row td { font-size:10px; padding:2px 5px; }
  @media print {
    body { background:#fff; color:#000; }
    .app { display:none !important; }
    .ds { display:block !important; box-shadow:none; padding:0; }
    .ds td, .ds th { font-size:9px; padding:1.5px 3px; }
    .ds h2 { font-size:13px; }
    .ds div, .ds span, .ds p { font-size:9px; }
    .ds svg { max-height:200px; }
    .ds button { display:none !important; }
    @page { size:A4 portrait; margin:7mm; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/*__RLP_ENGINE__*/
const RLP = window.RLPEngine;
const fnum = (v, d) => (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(d);
const UNITS = { flow:['l/m','m³/hr','usgpm','gpm','l/s','l/hr'], pres:['Bar','psi','kPa','MPa'], visc:['cP','Pas','mPas','SSU'] };

function App(){
  const [series, setSeries] = React.useState('Revolution RLP');
  const [flow, setFlow] = React.useState(10);
  const [flowUnit, setFlowUnit] = React.useState('l/m');
  const [pres, setPres] = React.useState(1);
  const [presUnit, setPresUnit] = React.useState('Bar');
  const [visc, setVisc] = React.useState(1);
  const [viscUnit, setViscUnit] = React.useState('cP');
  const [isf, setIsf] = React.useState(false);
  const [rv, setRv] = React.useState(false);
  const [flushed, setFlushed] = React.useState('No');
  const [cls, setCls] = React.useState(null);
  const [sel, setSel] = React.useState(null);   // selected size
  const [cust, setCust] = React.useState(''); const [proj, setProj] = React.useState(''); const [prep, setPrep] = React.useState('');

  const inputs = { flow, flowUnit, pres, presUnit, visc, viscUnit, isf, rv, flushed };
  const eng = RLP.ENGINES[series];
  const res = React.useMemo(() => RLP.calcSeries(series, inputs), [series, flow, flowUnit, pres, presUnit, visc, viscUnit, isf, rv, flushed]);
  const clsKey = cls || eng.classes[0].key;
  const rows = (res && res.rows[clsKey]) || [];
  const hp = (flowUnit === 'gpm' || flowUnit === 'usgpm');
  const selRow = sel ? rows.find(r => r.size === sel) : null;
  const curve = React.useMemo(() => (selRow && selRow.ok && RLP.speedCurve) ? RLP.speedCurve(series, selRow.size, clsKey, inputs) : null,
    [series, clsKey, selRow, flow, flowUnit, pres, presUnit, visc, viscUnit, isf, rv, flushed]);
  const qScale = (flowUnit === 'gpm') ? 4.546092 : (flowUnit === 'usgpm') ? 3.785412 : 1;
  const dateStr = new Date().toLocaleDateString('en-GB');

  const switchSeries = (k) => { setSeries(k); setCls(null); setSel(null); };

  const colMap = (row) => ({
    rpm: fnum(row.rpm, 0), power: fnum(row.power, 2), torque: fnum(row.torque, 2),
    npshr: row.npshr !== undefined ? fnum(row.npshr, 2) : null,
    npshr12: row.npshr12 !== undefined ? fnum(row.npshr12, 2) : null,
    npshr34: row.npshr34 !== undefined ? fnum(row.npshr34, 2) : null,
    tip: fnum(row.tip, 2), maxSpeed: fnum(row.maxSpeed, 0), maxPres: fnum(row.maxPres, 1),
    disp: fnum(row.disp, 3), portIn: fnum(row.portIn, 2), portMm: fnum(row.portMm, 0), rotorDia: fnum(row.rotorDia, 0),
    flowVar: fnum(row.flowVar, 1), speedVar: fnum(row.speedVar, 0),
  });

  return (
  <>
  <div className="app max-w-7xl mx-auto p-5">
    <div className="card p-4 mb-4" style={{background:'linear-gradient(90deg,#1f4e79,#2e75b6)'}}>
      <h1 className="text-xl font-bold" style={{color:'#fff'}}>WFT HYGIENIC PUMP SELECTOR</h1>
      <div className="text-xs" style={{color:'#cfe3f7'}}>Viking Pump Hygienic Ltd. (formerly Wright Flow Technologies) — vikingpump.com/hygienic</div>
    </div>

    <div className="flex gap-1 mb-3 flex-wrap">
      {Object.keys(RLP.ENGINES).map(k => (
        <div key={k} className={`tab ${series === k ? 'on' : ''}`} onClick={() => switchSeries(k)}>{k}</div>
      ))}
    </div>

    <div className="card p-4 mb-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div><label className="text-xs text-gray-400">Flowrate</label>
          <div className="flex gap-1"><input className="inp" type="number" value={flow} onChange={e=>setFlow(+e.target.value)}/>
          <select className="inp w-24" value={flowUnit} onChange={e=>setFlowUnit(e.target.value)}>{UNITS.flow.map(u=><option key={u}>{u}</option>)}</select></div></div>
        <div><label className="text-xs text-gray-400">Pressure</label>
          <div className="flex gap-1"><input className="inp" type="number" value={pres} onChange={e=>setPres(+e.target.value)}/>
          <select className="inp w-24" value={presUnit} onChange={e=>setPresUnit(e.target.value)}>{UNITS.pres.map(u=><option key={u}>{u}</option>)}</select></div></div>
        <div><label className="text-xs text-gray-400">Viscosity</label>
          <div className="flex gap-1"><input className="inp" type="number" value={visc} onChange={e=>setVisc(+e.target.value)}/>
          <select className="inp w-24" value={viscUnit} onChange={e=>setViscUnit(e.target.value)}>{UNITS.visc.map(u=><option key={u}>{u}</option>)}</select></div></div>
        <div className="flex items-end gap-2">
          <label className="text-xs text-gray-400 block">Improved Surface Finish
            <select className="inp" value={isf?'Yes':'No'} onChange={e=>setIsf(e.target.value==='Yes')}>
              <option>No</option><option>Yes</option></select></label>
          {(series==='MP-CP'||series==='Sterilobe') && (
            <label className="text-xs text-gray-400 block">Relief Valve
              <select className="inp" value={rv?'Yes':'No'} onChange={e=>setRv(e.target.value==='Yes')}>
                <option>No</option><option>Yes</option></select></label>)}
          {series==='Acculobe' && (
            <label className="text-xs text-gray-400 block">Flushed Seal
              <select className="inp" value={flushed} onChange={e=>setFlushed(e.target.value)}>
                <option>No</option><option>Yes</option></select></label>)}
        </div>
      </div>
    </div>

    <div className="card p-4 mb-4">
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <span className="sec">ROTOR CLASS</span>
        {eng.classes.map(c => <button key={c.key} onClick={()=>{setCls(c.key); setSel(null);}}
          className={`tab ${clsKey===c.key?'on':''}`} style={{borderRadius:8, border:'1px solid #30363d'}}>{c.label}</button>)}
        <span className="ml-auto text-xs text-gray-400">Recommended (Std): <b style={{color:'#58a6ff'}}>{res ? res.recommended : '—'}</b></span>
      </div>
      <div className="overflow-x-auto">
        <table className="res">
          <thead><tr>
            <th className="l">Size</th><th>Disp<br/>l/rev</th><th>Port<br/>in</th><th>RPM</th><th>Power<br/>{hp?'HP':'kW'}</th><th>Torque<br/>{hp?'lb-ft':'Nm'}</th>
            <th>NPSHr<br/>{hp?'ft':'m'}</th>
            {rows[0] && rows[0].npshr12 !== undefined && <th>NPSHr ½"</th>}
            {rows[0] && rows[0].npshr34 !== undefined && <th>NPSHr ¾"</th>}
            <th>Tip<br/>m/s</th><th>Max<br/>RPM</th><th>Max<br/>Bar</th><th>Status</th>
          </tr></thead>
          <tbody>
          {rows.map((r, i) => {
            const c = colMap(r);
            const isRec = r.size === res.recommended;
            return <tr key={r.size} className={`${isRec?'rec':''} ${!r.ok?'bad':''} ${sel===r.size?'sel':''}`} onClick={()=>{ if(r.ok) setSel(r.size); }}>
              <td className="l font-semibold">{series==='MP-CP' ? 'MP'+r.size : r.size} {isRec && <span className="badge">★REC</span>}</td>
              <td>{c.disp}</td><td>{c.portIn}</td>
              <td style={{fontWeight:600}}>{c.rpm}</td><td>{c.power}</td><td>{c.torque}</td>
              <td>{r.npshr !== undefined ? c.npshr : (r.npshr34 !== undefined ? c.npshr34 : c.npshr12)}</td>
              {r.npshr12 !== undefined && <td>{c.npshr12}</td>}
              {r.npshr34 !== undefined && <td>{c.npshr34}</td>}
              <td>{c.tip}</td><td>{c.maxSpeed}</td><td>{c.maxPres}</td>
              <td className="l">{r.ok ? <span style={{color:'#3fb950'}}>✓</span> : <span style={{fontSize:10}}>{r.reason}</span>}</td>
            </tr>;
          })}
          </tbody>
        </table>
      </div>
      <div className="text-xs text-gray-500 mt-2">Click a row to generate its datasheet. N/A cells shown as —.</div>
    </div>

    <div className="foot text-center pb-4 text-xs text-gray-500">
      Values auto-calculated per the WFT selector workbook (Issue C.10/13). Confirm final selection with Viking Pump Hygienic Ltd.
      <br/>Product/feature data per vikingpump.com/hygienic — 3-A SSI • CE (2006/42/EC) • ATEX.
    </div>
  </div>

  {selRow && (
  <div className="ds max-w-6xl mx-auto mb-8">
    <table style={{width:'100%',borderCollapse:'collapse'}}>
      <tbody>
      <tr><td colSpan="6" style={{background:'#1f4e79',color:'#fff',fontSize:16,fontWeight:800,padding:'8px 12px'}}>VIKING PUMP HYGIENIC</td></tr>
      <tr><td colSpan="6" style={{background:'#2e75b6',color:'#fff',fontWeight:700,padding:'5px 12px'}}>{series} — {eng.classes.find(c=>c.key===clsKey).label}</td></tr>
      <tr><td colSpan="6" style={{fontStyle:'italic',fontSize:10,color:'#666',padding:'3px 12px'}}>Formerly Wright Flow Technologies (WFT) • www.vikingpump.com/hygienic</td></tr>
      <tr><th colSpan="6" style={{background:'#d9d9d9'}}>1 • APPLICATION / DUTY</th></tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Customer</b></td><td><input className="inp" value={cust} onChange={e=>setCust(e.target.value)}/></td>
        <td style={{background:'#f2f2f2'}}><b>Project / Ref</b></td><td><input className="inp" value={proj} onChange={e=>setProj(e.target.value)}/></td>
        <td style={{background:'#f2f2f2'}}><b>Date</b></td><td>{dateStr}</td>
      </tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Flowrate</b></td><td>{flow} {flowUnit}</td>
        <td style={{background:'#f2f2f2'}}><b>Pressure</b></td><td>{pres} {presUnit}</td>
        <td style={{background:'#f2f2f2'}}><b>Viscosity</b></td><td>{visc} {viscUnit}</td>
      </tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Prepared by</b></td><td><input className="inp" value={prep} onChange={e=>setPrep(e.target.value)}/></td>
        <td style={{background:'#f2f2f2'}}><b>Improved Surface Finish</b></td><td>{isf?'Yes':'No'}</td>
        <td style={{background:'#f2f2f2'}}><b>Relief Valve / Flushed</b></td><td>{series==='Acculobe' ? flushed : (rv?'Yes':'No')}</td>
      </tr>
      <tr><th colSpan="6" style={{background:'#d9d9d9'}}>2 • SELECTED PUMP — {series==='MP-CP' ? 'MP'+selRow.size : selRow.size} ({eng.classes.find(c=>c.key===clsKey).label})</th></tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Pump Speed</b></td><td>{colMap(selRow).rpm} rpm</td>
        <td style={{background:'#f2f2f2'}}><b>Power Required</b></td><td>{colMap(selRow).power} {hp?'HP':'kW'}</td>
        <td style={{background:'#f2f2f2'}}><b>Torque Required</b></td><td>{colMap(selRow).torque} {hp?'lb-ft':'Nm'}</td>
      </tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>NPSHr</b></td><td>{selRow.npshr!==undefined?colMap(selRow).npshr:(selRow.npshr34!==undefined?`${colMap(selRow).npshr34} (¾") / ${colMap(selRow).npshr12} (½")`:'—')} {hp?'ft':'m'}</td>
        <td style={{background:'#f2f2f2'}}><b>Tip Speed</b></td><td>{colMap(selRow).tip} m/s</td>
        <td style={{background:'#f2f2f2'}}><b>Flow Variation</b></td><td>±{colMap(selRow).flowVar} {flowUnit}</td>
      </tr>
      <tr><th colSpan="6" style={{background:'#d9d9d9'}}>3 • PUMP SPECIFICATIONS</th></tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Displacement</b></td><td>{colMap(selRow).disp} l/rev</td>
        <td style={{background:'#f2f2f2'}}><b>Port Size</b></td><td>{selRow.portIn} in ({selRow.portMm} mm)</td>
        <td style={{background:'#f2f2f2'}}><b>Rotor Diameter</b></td><td>{selRow.rotorDia ? colMap(selRow).rotorDia+' mm' : '—'}</td>
      </tr>
      <tr>
        <td style={{background:'#f2f2f2'}}><b>Max Speed</b></td><td>{colMap(selRow).maxSpeed} rpm</td>
        <td style={{background:'#f2f2f2'}}><b>Max Pressure</b></td><td>{colMap(selRow).maxPres} Bar</td>
        <td style={{background:'#f2f2f2'}}><b>Max Shaft Torque</b></td><td>{fnum(selRow.maxTorque,0)} Nm</td>
      </tr>
      <tr><th colSpan="6" style={{background:'#d9d9d9'}}>4 • OPTIONS &amp; FEATURES (per vikingpump.com/hygienic)</th></tr>
      <tr><td colSpan="6" style={{fontSize:10}}>• CIP (Clean-In-Place) standard — self-draining head, cusp reliefs, dynamic seal leak path, no dead zones</td></tr>
      <tr><td colSpan="6" style={{fontSize:10}}>• Porting — Hygienic: Tri-clamp, DIN 11864, DIN 11851, SMS • Industrial: ASA/ANSI RF, DIN 2633, BSP/NPT • Jackets available</td></tr>
      <tr><td colSpan="6" style={{fontSize:10}}>• Sealing — single/double mechanical (flush), O-ring on replaceable sleeve; full material range • Front-loading seal changes</td></tr>
      <tr><th colSpan="6" style={{background:'#d9d9d9'}}>5 • CERTIFICATIONS &amp; MANUFACTURING</th></tr>
      <tr><td colSpan="6" style={{fontSize:10}}>• 3-A Sanitary Standards (3-A SSI) &nbsp;•&nbsp; CE — Machinery Directive 2006/42/EC &nbsp;•&nbsp; ATEX</td></tr>
      <tr><td colSpan="6" style={{fontSize:10}}>• Manufactured in Cedar Falls, Iowa, USA &amp; Eastbourne, UK — Viking Pump Hygienic Ltd. (formerly Wright Flow Technologies)</td></tr>
      <tr><td colSpan="6" style={{fontSize:8,color:'#666',fontStyle:'italic'}}>Values auto-calculated per the WFT selector. Confirm final selection with Viking Pump Hygienic Ltd.</td></tr>
      </tbody>
    </table>
    {curve && curve.lines && curve.lines.length > 1 && (() => {
      const W=700,H=220,PL=58,PR=20,PT=14,PB=42;
      const qMax = Math.max(...curve.lines.map(l=>l.pts[l.pts.length-1].q), curve.dutyQ) * 1.06 || 1;
      const X = r => PL + (r/curve.maxSpeed)*(W-PL-PR);
      const Y = q => PT + (1 - q/qMax)*(H-PT-PB);
      const colorOf = ln => ln.P === 0 ? '#2e75b6' : ln.P === curve.dutyP ? '#1f4e79' : '#c00000';
      const gridR = [0,0.2,0.4,0.6,0.8,1].map(f=>f*curve.maxSpeed);
      const gridQ = [0,0.25,0.5,0.75,1].map(f=>f*qMax);
      return (
      <div className="mt-3" style={{border:'1px solid #ccc',borderRadius:8,padding:10,background:'#fff'}}>
        <div className="text-sm font-semibold" style={{color:'#1f4e79'}}>Performance Curve — Flow vs Pump Speed (0 – {fnum(curve.maxSpeed,0)} rpm)</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:W}}>
          {gridQ.map(q=>(
            <g key={'gq'+q}>
              <line x1={X(0)} y1={Y(q)} x2={X(curve.maxSpeed)} y2={Y(q)} stroke="#e8e8e8" strokeWidth="1"/>
              <text x={PL-6} y={Y(q)+3} fontSize="10" fill="#666" textAnchor="end">{fnum(q/qScale, qMax>200?0:1)}</text>
            </g>))}
          {gridR.map(r=>(
            <g key={'gr'+r}>
              <line x1={X(r)} y1={Y(0)} x2={X(r)} y2={Y(qMax)} stroke="#e8e8e8" strokeWidth="1"/>
              <text x={X(r)} y={H-18} fontSize="10" fill="#666" textAnchor="middle">{fnum(r,0)}</text>
            </g>))}
          <line x1={X(0)} y1={Y(0)} x2={X(0)} y2={Y(qMax)} stroke="#555" strokeWidth="1.5"/>
          <line x1={X(0)} y1={Y(0)} x2={X(curve.maxSpeed)} y2={Y(0)} stroke="#555" strokeWidth="1.5"/>
          {curve.lines.map((ln,li)=>{
            const d = ln.pts.map((p,i)=>(i?'L':'M')+X(p.rpm).toFixed(1)+' '+Y(p.q/qScale).toFixed(1)).join(' ');
            const isDuty = ln.P === curve.dutyP;
            return <path key={'ln'+li} d={d} fill="none" stroke={colorOf(ln)} strokeWidth={isDuty?3.5:2.2} strokeLinecap="round" strokeLinejoin="round"/>;
          })}
          <circle cx={X(curve.dutyRpm)} cy={Y(curve.dutyQ/qScale)} r="6" fill="#c00000" stroke="#fff" strokeWidth="2"/>
          <text x={X(curve.dutyRpm)+8} y={Y(curve.dutyQ/qScale)-8} fontSize="11" fontWeight="bold" fill="#c00000">Duty point ({fnum(curve.dutyRpm,0)} rpm, {fnum(curve.dutyQ/qScale,1)} {flowUnit==='l/m'?'l/min':flowUnit})</text>
          <text x={PL+((W-PL-PR)/2)} y={H-2} fontSize="10" fill="#333" fontWeight="bold" textAnchor="middle">Pump Speed (rpm)</text>
          <text x={12} y={PT+((H-PT-PB)/2)} fontSize="10" fill="#333" fontWeight="bold" transform={`rotate(-90 12 ${PT+((H-PT-PB)/2)})`} textAnchor="middle">Flow ({flowUnit==='l/m'?'l/min':flowUnit})</text>
        </svg>
        <div className="text-xs" style={{color:'#555'}}>
          {curve.lines.map((ln,i)=>(
            <span key={'lg'+i} style={{marginRight:14}}><span style={{display:'inline-block',width:22,height:3,background:colorOf(ln),verticalAlign:'middle',marginRight:5}}/>{ln.P===0?'0 bar':ln.P===curve.dutyP?fnum(ln.P,1)+' bar (duty)':ln.P===curve.maxP?fnum(ln.P,1)+' bar (max)':fnum(ln.P,1)+' bar'}</span>
          ))}
          <span>● <b style={{color:'#c00000'}}>duty point</b></span> — Q = rpm × displacement − slip(P)
        </div>
      </div>);
    })()}
    <div style={{marginTop:8,paddingTop:4,borderTop:'1.5px solid #1f4e79',fontSize:10,color:'#333'}}>
      <b>Siamraj Public Company Limited</b> — Authorized distributor of Viking Pump Hygienic (formerly WFT) · www.siamrajplc.com · <b style={{color:'#c00000'}}>v3.1</b>
    </div>
    <button onClick={()=>window.print()} className="mt-3 px-4 py-2 rounded font-semibold" style={{background:'#1f4e79',color:'#fff'}}>🖨 Print Datasheet</button>
  </div>
  )}
  </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
